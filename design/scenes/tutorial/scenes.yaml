schema_version: "0.2"
scenes:
  - id: sc_c0_quarry_road
    schema_version: "0.2"
    chapter: wn00_tutorial
    canon_status: direct
    source_beats: [c0_road_to_emonds_field, c0_black_rider_appears, c0_arrive_emonds_field]
    trigger: {type: call}
    background: quarry_road_cold
    cast:
      - {character: rand, portrait: rand_neutral, position: left}
      - {character: tam, portrait: tam_neutral, position: right}
    beats:
      - {type: action, action: narration, text: "The cart creaks down the Quarry Road. Cider barrels knock."}
      - {type: action, action: narration, text: "Bel Tine smoke hangs faint ahead."}
      - {type: dialogue, speaker: rand, intent: anticipation, text: "The Green will be loud by now. Bran will want these barrels in the cellar."}
      - {type: dialogue, speaker: tam, intent: reassurance, text: "Then we take them in. After that you can look for Egwene."}
      - {type: action, action: transition_close}
      - {type: dialogue, speaker: rand, intent: alarm, text: "Someone is on the rise. A rider in a black cloak, on a black horse."}
      - {type: dialogue, speaker: tam, intent: guarded_check, text: "I see an empty road, lad. Even this ground keeps hoofprints."}
      - {type: dialogue, speaker: rand, intent: lingering_dread, text: "He was there. His cloak never moved. Then he was gone."}
      - {type: dialogue, speaker: tam, intent: keep_moving, text: "Days like these make a man see things. Keep to the cart. We still have light."}
      - {type: action, action: transition_open}
  - id: sc_c0_mat_and_news
    schema_version: "0.2"
    chapter: wn00_tutorial
    canon_status: direct
    source_beats: [c0_meet_village_circle]
    trigger: {type: call}
    background: emonds_field_day
    cast:
      - {character: rand, portrait: rand_neutral, position: left}
      - {character: mat, portrait: mat_neutral, position: right}
    beats:
      - {type: dialogue, speaker: mat, intent: greeting, text: "Rand! I nearly started Bel Tine without you."}
      - {type: dialogue, speaker: rand, intent: task_focus, text: "Cider first. Tam would have my hide, and Bran after him."}
      - {type: dialogue, speaker: mat, intent: mischief, text: "Burn me, I'd rather play stones than tote barrels. Fine. After, find me."}
      - {type: dialogue, speaker: mat, intent: shared_fear, text: "Listen. Last evening I saw a man in a black cloak. The wind never touched it."}
      - {type: dialogue, speaker: rand, intent: confirmation, text: "I saw him too. I could swear he hated me."}
      - {type: dialogue, speaker: mat, intent: uneasy_joke, text: "Then I was not jumping at shadows. Do not laugh. He scared me."}
  - id: sc_c0_perrin_thom
    schema_version: "0.2"
    chapter: wn00_tutorial
    canon_status: direct
    source_beats: [c0_meet_village_circle, c0_meet_strangers]
    trigger: {type: call}
    background: emonds_field_day
    cast:
      - {character: rand, portrait: rand_neutral, position: left}
      - {character: perrin, portrait: perrin_neutral, position: right}
      - {character: thom, portrait: thom_neutral, position: right}
    beats:
      - {type: dialogue, speaker: perrin, intent: care, text: "Forge is nearly done. You look wind-chafed."}
      - {type: dialogue, speaker: rand, intent: unease, text: "The road felt wrong. I am glad to be here."}
      - {type: dialogue, speaker: perrin, intent: introduction, text: "This is Thom. He woke the inn in the dead of night."}
      - {type: dialogue, speaker: thom, intent: name_himself, text: "Thom Merrilin. Gleeman is the title I glory in, not Master."}
      - {type: dialogue, speaker: thom, intent: refuse_news, text: "I am here for my art, not for wars and peddler's talk."}
  - id: sc_c0_egwene
    schema_version: "0.2"
    chapter: wn00_tutorial
    canon_status: direct
    source_beats: [c0_meet_village_circle]
    trigger: {type: call}
    background: emonds_field_day
    cast:
      - {character: rand, portrait: rand_neutral, position: left}
      - {character: egwene, portrait: egwene_neutral, position: right}
    beats:
      - {type: dialogue, speaker: egwene, intent: direction, text: "You made it. The Green will not set itself."}
      - {type: dialogue, speaker: rand, intent: promise, text: "The cider is for the inn. Then I am free."}
      - {type: dialogue, speaker: egwene, intent: teasing_claim, text: "See that you are. I will not save you a place twice."}
      - {type: dialogue, speaker: egwene, intent: warning, text: "And stay clear of that lady until you must. Nynaeve already looks stormy."}
  - id: sc_c0_fain_news
    schema_version: "0.2"
    chapter: wn00_tutorial
    canon_status: direct
    source_beats: [c0_meet_strangers, c0_fain_troubling_news]
    trigger: {type: call}
    background: emonds_field_day
    cast:
      - {character: rand, portrait: rand_neutral, position: left}
      - {character: padan_fain, portrait: fain_neutral, position: right}
    beats:
      - {type: dialogue, speaker: padan_fain, intent: troubling_news, text: "They have raised a Dragon banner in Ghealdan."}
      - {type: dialogue, speaker: padan_fain, intent: pressure, text: "Men run to it, and men run to pull it down."}
      - {type: dialogue, speaker: rand, intent: denial, text: "The Dragon? That does not reach the Two Rivers."}
      - {type: dialogue, speaker: padan_fain, intent: false_dragon, text: "A false Dragon, they say. In Ghealdan, men are already killing men."}
      - {type: dialogue, speaker: padan_fain, intent: false_comfort, text: "Aes Sedai have ridden south from Tar Valon."}
      - {type: dialogue, speaker: padan_fain, intent: sell_the_news, text: "Drink while the barrels last. News keeps coming."}
  - id: sc_c0_travelers
    schema_version: "0.2"
    chapter: wn00_tutorial
    canon_status: direct
    source_beats: [c0_meet_strangers]
    trigger: {type: call}
    background: emonds_field_day
    cast:
      - {character: rand, portrait: rand_neutral, position: left}
      - {character: moiraine, portrait: moiraine_neutral, position: right}
      - {character: lan, portrait: lan_neutral, position: right}
    beats:
      - {type: dialogue, speaker: moiraine, intent: correct_title, text: "You may call me Moiraine. Not lady."}
      - {type: dialogue, speaker: rand, intent: polite_uncertainty, text: "You have come a long way for Bel Tine."}
      - {type: dialogue, speaker: moiraine, intent: withheld_purpose, text: "I collect old stories. This place you call the Two Rivers has worn other names."}
      - {type: dialogue, speaker: rand, intent: honest_doubt, text: "What ever happened here to interest someone like you?"}
      - {type: dialogue, speaker: moiraine, intent: quiet_reading, text: "Later, perhaps. A festival hides worry poorly."}
      - {type: dialogue, speaker: lan, intent: warning, text: "Watch the roads after dark."}
  - id: sc_c0_tam_waits
    schema_version: "0.2"
    chapter: wn00_tutorial
    canon_status: gameplay_invention
    source_beats: [c0_tutorial_errands, c0_tam_decides_return]
    trigger: {type: call}
    background: emonds_field_day
    cast:
      - {character: rand, portrait: rand_neutral, position: left}
      - {character: tam, portrait: tam_neutral, position: right}
    beats:
      - {type: dialogue, speaker: tam, intent: fatherly_patience, text: "Cider first, lad. Bran is waiting on those barrels."}
      - {type: dialogue, speaker: tam, intent: time_pressure, text: "Greet your friends after. The light will not wait on talk."}
  - id: sc_c0_delivery
    schema_version: "0.2"
    chapter: wn00_tutorial
    canon_status: gameplay_invention
    source_beats: [c0_tutorial_errands]
    trigger: {type: call}
    background: winespring_inn
    cast:
      - {character: rand, portrait: rand_neutral, position: left}
    beats:
      - {type: action, action: narration, text: "The Winespring cellar is cool. Bran's casks sit where they belong."}
      - {type: action, action: narration, text: "Open Item. Equip the bow before practice, or find Tam."}
  - id: sc_c0_archery
    schema_version: "0.2"
    chapter: wn00_tutorial
    canon_status: gameplay_invention
    source_beats: [c0_tutorial_errands]
    trigger: {type: call}
    background: emonds_field_day
    cast:
      - {character: rand, portrait: rand_neutral, position: left}
    beats:
      - {type: dialogue, speaker: rand, intent: remembered_teaching, text: "Flame first, then the void. Straw and wood will wait."}
  - id: sc_c0_depart_for_farm
    schema_version: "0.2"
    chapter: wn00_tutorial
    canon_status: direct
    source_beats: [c0_tam_decides_return]
    trigger: {type: call}
    background: emonds_field_day
    cast:
      - {character: rand, portrait: rand_neutral, position: left}
      - {character: tam, portrait: tam_neutral, position: right}
    beats:
      - {type: dialogue, speaker: tam, intent: decision, text: "Light is going. I have no liking for leaving the farm with the wolves as they are."}
      - {type: dialogue, speaker: rand, intent: attachment, text: "There is a gleeman, Tam. The Green still looks safe."}
      - {type: dialogue, speaker: tam, intent: ordinary_duty, text: "We will be back for the dancing. The farm still needs us tonight."}
      - {type: dialogue, speaker: rand, intent: lingering_unease, text: "If that rider is out there, I do not want dusk on the Quarry Road."}
      - {type: action, action: transition_close}
