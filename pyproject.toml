[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "winternight-gen"
version = "0.0.1"
description = "Deterministic structured-spec compiler for a pinned Lex Talionis project"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "pillow==11.3.0",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.9",
]

[project.scripts]
winternight = "winternight_gen.cli:main"
storygen = "winternight_gen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/winternight_gen"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
