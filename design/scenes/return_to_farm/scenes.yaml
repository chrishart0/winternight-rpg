schema_version: "0.2"
scenes:
  - id: sc_c3_return_intro
    schema_version: "0.2"
    chapter: wn03_return_to_farm
    canon_status: direct
    source_beats: [c3_rand_returns_alone]
    trigger: {type: call}
    background: farm_ruined
    cast:
      - {character: rand, portrait: rand_frightened, position: left}
    beats:
      - {type: action, action: narration, text: "Smoke hangs in the trees. The farm is a broken shape."}
      - {type: dialogue, speaker: rand, intent: frightened_duty, text: "Tam is waiting. If I move like I was stalking a rabbit, they may not hear me."}
  - id: sc_c3_farmhouse_approach
    schema_version: "0.2"
    chapter: wn03_return_to_farm
    canon_status: direct
    source_beats: [c3_home_changed, c3_supply_search]
    trigger: {type: call}
    background: farm_ruined
    cast:
      - {character: rand, portrait: rand_frightened, position: left}
    beats:
      - {type: dialogue, speaker: rand, intent: changed_home, text: "Home. What is left of it."}
      - {type: dialogue, speaker: rand, intent: plan, text: "Water, cloth, a blanket. Then I get out."}
  - id: sc_c3_water
    schema_version: "0.2"
    chapter: wn03_return_to_farm
    canon_status: gameplay_invention
    source_beats: [c3_supply_search]
    trigger: {type: call}
    background: farm_ruined
    cast: [{character: rand, portrait: rand_frightened, position: left}]
    beats: [{type: dialogue, speaker: rand, intent: care, text: "The flask is full. He will need every swallow."}]
  - id: sc_c3_bandages
    schema_version: "0.2"
    chapter: wn03_return_to_farm
    canon_status: gameplay_invention
    source_beats: [c3_supply_search]
    trigger: {type: call}
    background: farm_ruined
    cast: [{character: rand, portrait: rand_frightened, position: left}]
    beats: [{type: dialogue, speaker: rand, intent: care, text: "Clean enough. I can bind him with this."}]
  - id: sc_c3_blankets
    schema_version: "0.2"
    chapter: wn03_return_to_farm
    canon_status: gameplay_invention
    source_beats: [c3_supply_search]
    trigger: {type: call}
    background: farm_ruined
    cast: [{character: rand, portrait: rand_frightened, position: left}]
    beats: [{type: dialogue, speaker: rand, intent: care, text: "Blankets. If I cannot bring the cart, I can still keep the cold off him."}]
  - id: sc_c3_sword_recovery
    schema_version: "0.2"
    chapter: wn03_return_to_farm
    canon_status: direct
    source_beats: [c3_recover_sword]
    trigger: {type: call}
    background: farm_ruined
    cast:
      - {character: rand, portrait: rand_frightened, position: left}
    beats:
      - {type: dialogue, speaker: rand, intent: sword_recovery, text: "He still will not tell me what this blade is. He may need it."}
  - id: sc_c3_trolloc_appears
    schema_version: "0.2"
    chapter: wn03_return_to_farm
    canon_status: gameplay_invention
    source_beats: [c3_lone_trolloc, c3_wounded_trolloc_setup]
    trigger: {type: call}
    background: farm_ruined
    cast:
      - {character: rand, portrait: rand_frightened, position: left}
      - {character: wounded_trolloc, portrait: trolloc_wounded, position: right}
    beats:
      - {type: action, action: show_portrait, asset: trolloc_wounded}
      - {type: action, action: sound, asset: growl_nearby}
      - {type: action, action: narration, text: "One of them stayed. Hurt. Waiting in the wreck of the yard."}
      - {type: dialogue, speaker: wounded_trolloc, intent: lure, text: "Others run. Narg wait. Narg clever."}
      - {type: dialogue, speaker: wounded_trolloc, intent: demand, text: "Blade down. Narg not bite. Narg talk."}
      - {type: dialogue, speaker: rand, intent: fear, text: "Stay back. I only need a way out."}
  - id: sc_c3_rand_combat_quote
    schema_version: "0.2"
    chapter: wn03_return_to_farm
    canon_status: direct
    source_beats: [c3_lone_trolloc]
    trigger: {type: call}
    background: farm_ruined
    cast:
      - {character: rand, portrait: rand_frightened, position: left}
      - {character: wounded_trolloc, portrait: trolloc_wounded, position: right}
    beats:
      - {type: dialogue, speaker: wounded_trolloc, intent: threat, text: "Myrddraal want words. Narg keep you. Others come."}
      - {type: dialogue, speaker: rand, intent: desperation, text: "I am not a soldier. Get away from me."}
  - id: sc_c3_rejoin_tam
    schema_version: "0.2"
    chapter: wn03_return_to_farm
    canon_status: direct
    source_beats: [c3_rand_rejoins_tam]
    trigger: {type: call}
    background: westwood_night
    cast:
      - {character: rand, portrait: rand_determined, position: left}
      - {character: tam, portrait: tam_wounded, position: right}
    beats:
      - {type: dialogue, speaker: rand, intent: return_with_supplies, text: "I have the water, the cloth, the blanket."}
      - {type: dialogue, speaker: tam, intent: trust, text: "Good. Bind it. Then we walk."}
      - {type: dialogue, speaker: rand, intent: next_road, text: "Nynaeve can set this right. The village is still ahead."}
      - {type: dialogue, speaker: tam, intent: keep_moving, text: "Slowly. We do not stop on the road."}
      - {type: action, action: transition_close}
  - id: sc_c3_ending_card
    schema_version: "0.2"
    chapter: wn03_return_to_farm
    canon_status: direct
    source_beats: [c3_rand_rejoins_tam]
    trigger: {type: call}
    background: winternight_ending
    cast: []
    beats:
      - {type: action, action: ending_card, asset: winternight_ending, text: "End of Winternight"}
