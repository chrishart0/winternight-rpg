    - {type: action, action: narration, text: "Loose stones lie near the watching raven."}
    - {type: dialogue, speaker: rand, intent: resent_watcher, text: "Filthy carrion eater."}
    - {type: dialogue, speaker: mat, intent: resent_watcher, text: "I am tired of being stared at."}
- id: sc_c0_moiraine_coin
  schema_version: '0.2'
  chapter: wn00_tutorial
  canon_status: direct
  source_beats:
  - c0_raven_omen
  - c0_moiraine_coin
  - c0_meet_strangers
  trigger:
    type: call
  background: emonds_field_day
  cast:
  - character: rand
    portrait: rand_neutral
    position: left
  - character: mat
    portrait: mat_neutral
    position: center
  - character: moiraine
    portrait: moiraine_neutral
    position: right
  beats:
  - type: dialogue
    speaker: rand
    intent: disbelief
    text: Did you ever see a raven do that?
  - type: dialogue
    speaker: mat
    intent: confirm_omen
    text: Never. Nor any other bird, either.
  - type: dialogue
    speaker: moiraine
    intent: interrupt
    text: A vile bird, to be mistrusted in the best of times.
  - type: action
    action: narration
    text: The raven shrieks and flies west toward the mountains.
  - type: dialogue
    speaker: rand
    intent: greet_stranger
    text: Good morning, Lady Moiraine.
  - type: dialogue
    speaker: moiraine
    intent: name_herself
    text: You know my name. But you must call me Moiraine,
  - type: dialogue
    speaker: moiraine
    intent: name_herself
    text: not lady. And what are your names?
  - type: dialogue
    speaker: mat
    intent: introduce_self
    text: I'm Matrim Cauthon, Moiraine.
  - type: dialogue
    speaker: moiraine
    intent: offer_tasks
    text: I may have some small tasks to be done from time to time
  - type: dialogue
    speaker: moiraine
    intent: offer_tasks
    text: while I am in Emond's Field.
  - type: action
    action: narration
    text: She closes a heavy silver coin first
  - type: action
    action: narration
    text: into Rand's hand, then Mat's.
  - type: dialogue
    speaker: moiraine
    intent: bind_by_token
    text: Consider this a token, and keep it with you.
  - type: dialogue
    speaker: moiraine
    intent: bind_by_token
    text: There is a bond between us now.
  - type: dialogue
    speaker: rand
    intent: ask_purpose
    text: Why have you come to Emond's Field?
  - type: dialogue
    speaker: moiraine
    intent: partial_answer
    text: I am a student of history, a collector of old stories.
  - type: dialogue
    speaker: moiraine
    intent: promise_later
    text: Later we must talk,
  - type: dialogue
    speaker: moiraine
    intent: promise_later
    text: and you must tell me all about yourselves.
  - type: action
    action: narration
    text: Moiraine walks on with Lan. Across the bridge,
  - type: action
    action: narration
    text: Padan Fain's wagon rolls onto the Green.
- id: sc_c0_fain_news
  schema_version: '0.2'
  chapter: wn00_tutorial
  canon_status: direct
  source_beats:
  - c0_fain_troubling_news
  trigger:
    type: call
  background: emonds_field_day
  cast:
  - character: rand
    portrait: rand_neutral
    position: left
  - character: bran
    portrait: bran_neutral
    position: center
  - character: padan_fain
    portrait: fain_neutral
    position: right
  beats:
  - type: action
    action: narration
    text: The known peddler waits atop his wagon
  - type: action
    action: narration
    text: until every festival face turns toward him.
  - type: dialogue
    speaker: padan_fain
    intent: command_crowd
    text: No, not later. I will be telling you now.
  - type: dialogue
    speaker: padan_fain
    intent: name_war
    text: Men killing men. It is war I mean.
  - type: dialogue
    speaker: padan_fain
    intent: name_war
    text: There is war in Ghealdan, war and madness.
  - type: dialogue
    speaker: bran
    intent: ask_cause
    text: War? Why are they having a war?
  - type: dialogue
    speaker: padan_fain
    intent: reveal_banner
    text: The standard of the Dragon has been raised,
  - type: dialogue
    speaker: padan_fain
    intent: reveal_banner
    text: and men flock to oppose. And to support.
  - type: action
    action: narration
    text: The crowd gasps as one.
  - type: dialogue
    speaker: padan_fain
    intent: deepen_fear
    text: I do know that he can wield the One Power.
  - type: dialogue
    speaker: padan_fain
    intent: deepen_fear
    text: The others couldn't. But he can channel.
  - type: dialogue
    speaker: bran
    intent: take_counsel
    text: This goes beyond mere news from outside.
  - type: dialogue
    speaker: bran
    intent: take_counsel
    text: It must be discussed by the Village Council.
  - type: action
    action: narration
    text: The Council takes Fain into the inn.
- id: sc_c0_fain_aftershock
  schema_version: '0.2'
  chapter: wn00_tutorial
  canon_status: direct
  source_beats:
  - c0_fain_troubling_news
  - c0_meet_village_circle
  trigger:
    type: call
  background: emonds_field_day
  cast:
  - character: rand
    portrait: rand_neutral
    position: left
  - character: mat
    portrait: mat_neutral
    position: center
  - character: perrin
    portrait: perrin_neutral
