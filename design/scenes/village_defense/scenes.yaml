    canon_status: direct
    source_beats: [c2_bran_account]
    trigger: {type: call}
    background: winespring_inn_night
    cast: []
    beats:
      - {type: action, action: narration, text: "Bran's account carries us back to Winternight."}
      - {type: action, action: narration, text: "Winternight visits just beginning,"}
      - {type: action, action: narration, text: "our hands full of presents and honeycakes"}
      - {type: action, action: narration, text: "then the dogs snarling,"}
      - {type: action, action: narration, text: "and suddenly the two of them burst out of the inn,"}
      - {type: action, action: narration, text: "Why, she called ball lightning out of a clear night sky"}

