schema_version: "0.2"
id: westwood_road
width: 26
height: 10
# Long horizontal Quarry Road stretch through the Westwood. The road (y3) is the
# column's lane and the watched stretch; the litter trail (y6-7) runs parallel
# through tree-cover pockets. Deep woods bound the play space so the 2-unit party
# is never in empty acreage. Refinement pass (docs/c4-spike.md): the column will
# march with a Move_to-only AI along y3 and the hide window will become a danger
# region, both of which this topology already supports.
