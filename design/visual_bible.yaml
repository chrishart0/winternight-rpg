schema_version: "0.2"
style:
  description: >-
    GBA-era tactical RPG pixel illustration with readable silhouettes,
    restrained shading, rural medieval fantasy materials, and no photorealism.
  perspective: eye_level
  palette:
    saturation: restrained
    shadows: cool
    highlights: warm
  forbidden: [photorealism, modern_objects, copied_fire_emblem_assets, text_in_art]
identity_anchors:
  rand: [very_tall_and_lean, reddish_brown_hair, gray_eyes, plain_brown_wool]
  tam: [sturdy_middle_aged, dark_hair_with_gray, calm_expression, farm_clothing]
  moiraine: [small_composed_figure, dark_hair, blue_travel_clothes, controlled_presence]
  lan: [tall_hard_faced, dark_hair, muted_green_gray_clothes, watchful]
  trolloc: [bestial_humanoid, mismatched_animal_traits, crude_dark_armor, no_human_glamour]
processing:
  portrait_dimensions: [160, 112]
  background_dimensions: [240, 160]
  resampling: nearest_neighbor
  palette_colors_max: 64
  color_key: [128, 160, 128, 255]
