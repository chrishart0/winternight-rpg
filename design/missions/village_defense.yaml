    actions: [{type: lose}]

  - id: resident_east_falls
    trigger: {type: unit_death, unit: resident_east}
    priority: 30
    actions:
      - {type: increment_flag, target: rescue_losses, value: 1}
      - {type: play_scene, target: sc_c2_failure_resident_east}

  - id: resident_east_loss_quota_impossible
    trigger: {type: unit_death, unit: resident_east}
    condition: {level_var_compare: {name: rescue_losses, op: ge, value: 1}}
    priority: 20
    actions: [{type: lose}]

  - id: resident_south_falls
    trigger: {type: unit_death, unit: resident_south}
    priority: 30
    actions:
      - {type: increment_flag, target: rescue_losses, value: 1}
      - {type: play_scene, target: sc_c2_failure_resident_south}

  - id: resident_south_loss_quota_impossible
    trigger: {type: unit_death, unit: resident_south}
    condition: {level_var_compare: {name: rescue_losses, op: ge, value: 1}}
    priority: 20
    actions: [{type: lose}]


  - id: inn_breach_loss
    trigger: {type: unit_wait}
    condition: {trigger_unit_in_region: {team: enemy, region: inn_threshold}}
    actions:
      - {type: set_flag, target: inn_breached, value: true}
      - {type: play_scene, target: sc_c2_failure_inn_breach}
      - {type: lose}

  - id: background_west_catches
    trigger: {type: turn_start, turn: 2}
    actions:
      - {type: show_layer, target: background_west_burning}

  - id: torchbearers_advance
    # The door race starts on turn 2 rather than on the Talk chain, so teaching
    # Talk faster never shortens the time the far doors are winnable in.
    trigger: {type: turn_start, turn: 2}
    actions:
      - {type: change_ai, target: torch_west, value: seek_house_west}
      - {type: change_ai, target: torch_north, value: seek_house_north}
      - {type: change_ai, target: torch_east, value: seek_house_east}
      - {type: change_ai, target: torch_south, value: seek_house_south}

  - id: north_reinforcements
    trigger: {type: turn_start, turn: 3}
    actions:
      - {type: spawn_group, target: north_wave}
      - {type: highlight_target, target: north_wave_a}
      - {type: play_scene, target: sc_c2_north_wave}

  - id: background_west_collapses
    trigger: {type: turn_start, turn: 4}
    actions:
      - {type: show_layer, target: background_west_ruined}
      - {type: play_scene, target: sc_c2_unavoidable_damage_west}

  - id: flank_reinforcements_west
    trigger: {type: turn_start, turn: 5}
    actions:
      - {type: spawn_group, target: flank_wave_west}
      - {type: highlight_target, target: flank_wave_a}
      - {type: play_scene, target: sc_c2_flank_wave}

  - id: flank_reinforcements_east
    trigger: {type: turn_start, turn: 5}
    condition: {not_all_flags: [house_west_saved, house_north_saved, house_east_saved, house_south_saved]}
    actions:
      - {type: spawn_group, target: flank_wave_east}

  - id: background_east_catches
    trigger: {type: turn_start, turn: 6}
    actions:
      - {type: show_layer, target: background_east_burning}
      - {type: play_scene, target: sc_c2_south_warning}

  - id: final_south_reinforcements
    trigger: {type: turn_start, turn: 7}
    actions:
      - {type: spawn_group, target: final_south_wave}
      - {type: highlight_target, target: final_south_b}
      - {type: play_scene, target: sc_c2_final_wave}

  - id: background_east_collapses
    trigger: {type: turn_start, turn: 8}
    actions:
      - {type: show_layer, target: background_east_ruined}
      - {type: play_scene, target: sc_c2_unavoidable_damage_east}

  - id: hunter_west_falls
    trigger: {type: unit_death, unit: hunter_west}
    actions: [{type: set_flag, target: hunter_west_alive, value: false}]

  - id: hunter_east_falls
    trigger: {type: unit_death, unit: hunter_east}
    actions: [{type: set_flag, target: hunter_east_alive, value: false}]

  - id: militia_west_falls
    trigger: {type: unit_death, unit: militia_west}
    actions: [{type: set_flag, target: militia_west_alive, value: false}]

  - id: militia_east_falls
    trigger: {type: unit_death, unit: militia_east}
    actions: [{type: set_flag, target: militia_east_alive, value: false}]

  - id: militia_south_falls
    trigger: {type: unit_death, unit: militia_south}
    actions: [{type: set_flag, target: militia_south_alive, value: false}]

  - id: lan_combat_quote
    trigger: {type: combat_start, unit: lan}
    actions: [{type: play_scene, target: sc_c2_lan_combat_quote}]

  - id: moiraine_combat_quote
    trigger: {type: combat_start, unit: moiraine}
    actions: [{type: play_scene, target: sc_c2_moiraine_combat_quote}]

  # Only a player-initiated strike wakes it. Cursor hover, adjacency, and turn
  # changes cannot: do_nothing AI emits no behaviour at all on the enemy phase.
  - id: rider_wakes_when_struck
    trigger: {type: combat_end, unit2: rider_watch}
    condition: {trigger_unit_team: player}
    actions:
      - {type: play_scene, target: sc_c2_rider_wakes}
      - {type: change_ai, target: rider_watch, value: pursue}

  - id: mat_first_danger
    trigger: {type: combat_start, unit: mat_c2}
    actions: [{type: play_scene, target: sc_c2_mat_first_danger}]

  - id: egwene_first_danger
    trigger: {type: combat_start, unit: egwene_c2}
    actions: [{type: play_scene, target: sc_c2_egwene_first_danger}]

  - id: defense_tally_mastery
    trigger: {type: turn_start, turn: 9}
    condition: {all_flags: [house_west_saved, house_north_saved, house_east_saved, house_south_saved], level_var_compare: {name: residents_returned, op: ge, value: 4}}
    priority: 40
    actions: [{type: play_scene, target: sc_c2_defense_tally_mastery}]

  - id: defense_tally_survivor
    trigger: {type: turn_start, turn: 9}
    condition: {any_flags: [hunter_west_alive, hunter_east_alive, militia_west_alive, militia_east_alive, militia_south_alive], level_var_compare: {name: residents_returned, op: ge, value: 3}}
    priority: 40
    actions: [{type: play_scene, target: sc_c2_defense_tally_survivor}]

  - id: defense_win
    trigger: {type: turn_start, turn: 9}
    condition: {flag_false: inn_breached, level_var_compare: {name: residents_returned, op: ge, value: 3}}
    priority: 10
    actions: [{type: win}]

  - id: defense_loss_quota
    trigger: {type: turn_start, turn: 9}
    condition: {level_var_compare: {name: residents_returned, op: le, value: 2}}
    priority: 10
    actions:
      - {type: play_scene, target: sc_c2_failure_quota}
      - {type: lose}

  - id: defense_outro
    trigger: {type: level_end}
    actions:
      - {type: play_scene, target: sc_c2_defense_end}
narrative_constraints:
  event_role: inferred_parallel_event
  primary_combat_units: 5
  civilians_required: 3
  occupied_houses: 4
  allied_defenders: 6
  bran_and_thom_inside_inn: true
  luhhan_is_mortal: true
  named_playables_are_mortal: true
  unnamed_green_deaths_allowed: true
  total_annihilation_required: false
  unavoidable_village_damage: true
  bran_account_frames_battle: true
target_play: {minimum_turns: 8, maximum_turns: 8, expected_minutes: [20, 28]}
