  F: {terrain_id: forest, name: Westwood, color: [34, 68, 42], minimap: Forest, platform: Forest, movement_cost: 2}
  X: {terrain_id: dense_forest, name: Deep Woods, color: [20, 46, 28], minimap: Thicket, platform: Thicket, movement_cost: 99, blocks_movement: true}
