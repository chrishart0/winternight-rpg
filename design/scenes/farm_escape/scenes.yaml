schema_version: "0.2"
scenes:
  - id: sc_c1_farmhouse_calm
    schema_version: "0.2"
    chapter: wn01_farm_escape
    canon_status: direct
    source_beats: [c1_farmhouse_evening, c1_tam_reveals_sword, c1_trollocs_breach_farm]
    trigger: {type: call}
    background: farmhouse_evening
    cast:
      - {character: rand, portrait: rand_neutral, position: left}
      - {character: tam, portrait: tam_neutral, position: right}
    beats:
      - {type: dialogue, speaker: rand, intent: relief, text: "It is quieter than the Green."}
      - {type: dialogue, speaker: tam, intent: home, text: "That is why we came. Eat, then sleep."}
      - {type: dialogue, speaker: rand, intent: question_sword, text: "I never knew you kept a sword in the house."}
      - {type: dialogue, speaker: tam, intent: defer_explanation, text: "Old steel. Tonight is not the night for it."}
      - {type: action, action: sound, asset: impact_heavy}
      - {type: dialogue, speaker: rand, intent: alarm, text: "That was the door."}
      - {type: dialogue, speaker: tam, intent: command, text: "Bow. Behind me. When I say west, you run."}
  - id: sc_c1_farm_kit
    schema_version: "0.2"
    chapter: wn01_farm_escape
    canon_status: gameplay_invention
    source_beats: [c1_trollocs_breach_farm, c1_supplies_needed]
    trigger: {type: call}
    background: farm_night
    cast:
      - {character: rand, portrait: rand_frightened, position: left}
    beats:
      - {type: dialogue, speaker: rand, intent: frightened_practicality, text: "Clean cloth. If we live, Tam will need it."}
  - id: sc_c1_tam_combat_quote
    schema_version: "0.2"
    chapter: wn01_farm_escape
    canon_status: direct
    source_beats: [c1_trollocs_breach_farm, c1_rand_flees]
    trigger: {type: call}
    background: farm_night
    cast:
      - {character: tam, portrait: tam_battle, position: left}
    beats:
      - {type: dialogue, speaker: tam, intent: protection, text: "Stay behind me. The trees are the only fight."}
  - id: sc_c1_pursuit
    schema_version: "0.2"
    chapter: wn01_farm_escape
    canon_status: gameplay_invention
    source_beats: [c1_pursuit_closes, c1_rand_flees]
    trigger: {type: call}
    background: farm_night
    cast:
      - {character: tam, portrait: tam_battle, position: left}
      - {character: rand, portrait: rand_frightened, position: right}
    beats:
      - {type: dialogue, speaker: tam, intent: overwhelming_force, text: "More of them. Do not stand. West, Rand."}
  - id: sc_c1_tam_wounded
    schema_version: "0.2"
    chapter: wn01_farm_escape
    canon_status: direct
    source_beats: [c1_rand_flees, c1_tam_wounded]
    trigger: {type: call}
    background: farm_night
    cast:
      - {character: rand, portrait: rand_frightened, position: left}
      - {character: tam, portrait: tam_wounded, position: right}
    beats:
      - {type: action, action: transition_close}
      - {type: action, action: sound, asset: combat_distant}
      - {type: action, action: transition_open}
      - {type: action, action: narration, text: "Tam draws them off until the trees close around Rand."}
      - {type: dialogue, speaker: rand, intent: shock, text: "Tam. You are bleeding. Sit. Please."}
      - {type: dialogue, speaker: tam, intent: urgency, text: "Deep. We cannot stay this close to the house."}
  - id: sc_c1_supplies_needed
    schema_version: "0.2"
    chapter: wn01_farm_escape
    canon_status: direct
    source_beats: [c1_supplies_needed]
    trigger: {type: call}
    background: westwood_night
    cast:
      - {character: rand, portrait: rand_frightened, position: left}
      - {character: tam, portrait: tam_wounded, position: right}
    beats:
      - {type: dialogue, speaker: rand, intent: choose_duty, text: "You need water, cloth, a blanket. I will go back."}
      - {type: dialogue, speaker: tam, intent: warning, text: "Quiet is not safety. Take what we need. Come back."}
      - {type: dialogue, speaker: rand, intent: frightened_promise, text: "I will. I will not leave you here."}
      - {type: action, action: transition_close}
