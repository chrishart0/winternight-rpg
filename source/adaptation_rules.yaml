schema_version: "0.2"
decisions:
  - {id: road_as_scene, canon_status: gameplay_invention, decision: Present the Quarry Road cart journey and rider encounter through portraits against the road background., source_beats: [c0_road_to_emonds_field, c0_black_rider_appears], rationale: Preserve the book opening without spending a separate tactical layout on a scene with no player choice., canon_effect: presentation_only}
  - {id: tutorial_errands, canon_status: gameplay_invention, decision: "Require Mat's adjacent Talk, one cart-to-cellar delivery, two guided player-controlled raven attacks, and the final inn-door interaction.", source_beats: [c0_tutorial_errands], rationale: Teach movement Talk region objectives and attack targeting without a contrived fight., canon_effect: low_stakes_interactions_added}
  - {id: cider_cellar, canon_status: gameplay_invention, decision: Compress the eight cider barrels into one playable cart-to-cellar trip with Mat's cellar banter., source_beats: [c0_cider_cellar, c0_tutorial_errands], rationale: Keep the canon work without repeating a solved route., canon_effect: repeated_prose_action_compressed}
  - {id: scripted_tam_wound, canon_status: gameplay_invention, decision: Trigger Tam's scripted wound only after Rand successfully reaches the Westwood and never from the turn deadline., source_beats: [c1_rand_flees, c1_tam_wounded], rationale: Preserve the story outcome on successful escape without allowing player failure to continue the story., canon_effect: outcome_determinized}
  - {id: farm_escape_deadline, canon_status: gameplay_invention, decision: "Spawn the telegraphed two-unit pursuit from the east on turn 2 and make turn 8 a caught loss if Rand has not reached the Westwood.", source_beats: [c1_rand_flees, c1_pursuit_closes], rationale: Make westward escape mandatory while keeping the pursuit visible and the standing fight hopeless., canon_effect: tactical_timing_and_failure_invented}
  - {id: farmhouse_opening_split, canon_status: gameplay_invention, decision: "Present the farm chores and stew, the locked doors and hidden sword, and the doorway breach as consecutive scene cards before control opens in the yard.", source_beats: [c1_farmhouse_evening, c1_tam_reveals_sword, c1_trollocs_breach_farm], rationale: Preserve the book's calm unease and rupture while handing the canon escape directly to the playable objective., canon_effect: presentation_only}
  - {id: village_parallel_battle, canon_status: inferred, decision: "Include Lan, Moiraine, six village defenders, and owner-directed Mat, Egwene, and Nynaeve in the unseen parallel defense.", source_beats: [c2_emonds_field_attacked, c2_village_defense, c2_named_villagers_join], rationale: "Bran and Thom establish that villagers fought, but the exact named participation remains explicitly inferred.", canon_effect: unseen_parallel_sequence_constructed}
  - {id: village_defense_rules, canon_status: gameplay_invention, decision: "Hold the inn for eight turns, resolve four occupied house doors, and return at least three residents.", source_beats: [c2_defense_objective, c2_homes_threatened], rationale: "Create the requested defend and rescue loop without claiming a village-wide victory.", canon_effect: objective_and_tactical_detail_invented}
  - {id: named_villagers_join_defense, canon_status: inferred, decision: "Nynaeve begins with the defenders; Egwene and Mat begin green and may join through Talk. Perrin is not shown.", source_beats: [c2_named_villagers_join], rationale: "The owner directive supersedes the former absence decision, while later canon requires all three recruits to survive.", canon_effect: unseen_named_participation_inferred}
  - {id: talk_recruitment_staging, canon_status: gameplay_invention, decision: "Nynaeve recruits Egwene by Talk and sharply sends her to recruit Mat; completing that order points Mat at the south house and releases the four door-bound torchbearers.", source_beats: [c2_named_villagers_join, c2_defense_objective], rationale: "Teach Talk before the house race starts, then immediately demonstrate the mission's house-to-inn loop without spending the rescue clock on tutorial turns.", canon_effect: recruitment_mechanic_added}
  - {id: household_rescue_race, canon_status: gameplay_invention, decision: "The first side to each occupied door resolves it: a player Visit spawns a controlled resident whose first step into the inn returns them automatically, while that house's visible torchbearer creates ruins.", source_beats: [c2_defense_objective, c2_homes_threatened], rationale: "Turn threatened homes into a fair visible clock, keep unrelated raiders from ending the rescue race by accident, and remove a redundant Return-menu confirmation.", canon_effect: house_outcomes_and_escort_detail_invented}
  - {id: post_rescue_inn_assault, canon_status: gameplay_invention, decision: "Returning the third required resident triggers Lan's fall-back order and two telegraphed two-Trolloc groups that attack toward the inn from the north and south roads.", source_beats: [c2_village_defense, c2_defense_objective], rationale: "Make the fixed-duration defense peak after the rescue quota without increasing pressure during the outward rescue phase.", canon_effect: reinforcement_timing_and_tactical_pressure_invented}
  - {id: progressive_village_burning, canon_status: gameplay_invention, decision: "Background roofs ignite and collapse on turns 2, 4, 6, and 8 regardless of occupied-house results.", source_beats: [c2_homes_threatened], rationale: "Preserve unavoidable damage and connect the battle to the burned dawn; exact roofs and timing are invented.", canon_effect: presentation_and_timing_invented}
  - {id: nynaeve_battle_aid, canon_status: inferred, decision: "Nynaeve tends Haral with ordinary herbs during the defense.", source_beats: [c2_nynaeve_battle_aid], rationale: "Her Wisdom role supports plausible unseen care without suggesting true Healing or an ability to cure Tam's fever.", canon_effect: plausible_unseen_care_inferred}
  - {id: guided_heal_staging, canon_status: gameplay_invention, decision: "Recruiting Nynaeve focuses wounded Haral and teaches one player-performed Healing Herbs use.", source_beats: [c2_nynaeve_battle_aid, c2_defense_objective], rationale: "Teach the healer role through immediate safe demand without forcing the action.", canon_effect: tutorial_interaction_added}
  - {id: green_defenders, canon_status: inferred, decision: "Preserve Haral plus five unnamed defenders. Haral has no survival floor and may fall without ending the mission; unnamed defenders may also fall, and surviving defenders receive a resolution callback.", source_beats: [c2_bran_account, c2_village_defense, c2_nynaeve_battle_aid, c5_luhhan_meets], rationale: "The green line preserves visible cost without treating Haral as a lord or creating a loss roulette.", canon_effect: inferred_participants_added_without_named_fates}
  - {id: named_playable_permadeath, canon_status: gameplay_invention, decision: "Lan, Moiraine, Mat, Egwene, and Nynaeve die permanently as playable units; one prompt offers Restart or Continue, while portrait scenes remain unchanged.", source_beats: [c2_defense_objective, c2_named_villagers_join, c2_nynaeve_battle_aid], rationale: "Make tactical death real without deleting later story appearances or forcing a chapter loss.", canon_effect: named_playable_permadeath_added}
  - {id: bran_thom_inn_placement, canon_status: gameplay_invention, decision: "Bran and Thom stand inside the Winespring Inn during the parallel battle and offer optional Talk lines.", source_beats: [c2_bran_account, c2_village_defense], rationale: "Place the mayor and gleeman where Bran's later account implies they weathered the attack without making either a rescue or loss condition.", canon_effect: inferred_presence_staged_as_optional_npcs}
  - {id: dedicated_battle_layout, canon_status: gameplay_invention, decision: "Use the dedicated 22 by 18 emonds_field_battle layout and raise the unique-layout cap to five.", source_beats: [c2_emonds_field_attacked, c2_defense_objective, c2_homes_threatened], rationale: "Isolate the larger battle and its burn overlays from the tutorial and burned-dawn routes.", canon_effect: presentation_only}
  - {id: ruined_farm_fog, canon_status: gameplay_invention, decision: Cover the ruined-farm return map in short-range fog while Rand crosses alone toward the farmhouse lights., source_beats: [c3_rand_returns_alone], rationale: Turn the book's uncertain moonlit approach into limited tactical sight without changing any event or outcome., canon_effect: presentation_only}
  - {id: dead_flock_interrupt, canon_status: gameplay_invention, decision: Place the silent sheep pen across the western approach as a one-time Visit interrupt before the existing farmhouse region., source_beats: [c3_dead_flock], rationale: Make Rand physically pass the book's dread touch without moving the locked farmhouse search or escape regions., canon_effect: canonical_beat_staged_as_region}
  - {id: supply_regions, canon_status: gameplay_invention, decision: Translate the supply search into three care-bearing interactions plus a ruined-house approach., source_beats: [c3_home_changed, c3_supply_search], rationale: Give the prose action a readable tactical objective without turning home into a storehouse caption., canon_effect: search_granularity_invented}
  - {id: sword_search_reorder, canon_status: gameplay_invention, decision: Present Rand taking up Tam's already-carried sword again as the final ruin interaction after all three care searches., source_beats: [c3_supply_search, c3_recover_sword, c3_lone_trolloc], rationale: Preserve the locked search-flag gate and Narg spawn contract while acknowledging that the book places the initial sword-taking before Rand leaves Tam., canon_effect: canonical_action_reordered_for_gate}
  - {id: wounded_trolloc_fairness, canon_status: gameplay_invention, decision: Begin the isolated Trolloc already wounded., source_beats: [c3_wounded_trolloc_setup], rationale: Preserve danger without making Rand an expert., canon_effect: tactical_circumstances_adjusted}
  - {id: narg_lunge_exchange, canon_status: gameplay_invention, decision: Use the mandatory first combat exchange to stage Narg's sudden lunge and Rand bringing the sword up by terror and luck., source_beats: [c3_lone_trolloc, c3_wounded_trolloc_setup], rationale: Preserve the locked Narg intercept and escape gate while refusing to portray Rand's survival as a practiced sword victory., canon_effect: canonical_lunge_abstracted_as_combat}
  - {id: cart_litter_outro_split, canon_status: gameplay_invention, decision: Split the level-end outro into the wrecked-cart shaft discovery at the farm and the treatment and litter build beside Tam in the Westwood., source_beats: [c3_rand_rejoins_tam, c3_litter_built], rationale: Let each background match the visible place while preserving the book order and handing the finished litter to the Long Road., canon_effect: presentation_only}
  - {id: raven_tutorial, canon_status: gameplay_invention, decision: Spawn the watching raven as a stationary enemy then guide Rand and Mat to exact attack tiles for two player-controlled scripted misses before it flies off and Moiraine interrupts., source_beats: [c0_raven_omen, c0_moiraine_coin], rationale: The canon bird supplies a consequence-free attack lesson with visible movement and target selection but no random outcome., canon_effect: canon_moment_carries_tutorial}
  - {id: bran_account_framing, canon_status: direct, decision: Bookend the wn02 intro and outro with short direct quotations from Bran's Chapter 7 account while presenting the playable battle as the night the village later tells., source_beats: [c2_bran_account, c2_village_defense], rationale: Give the inferred parallel battle a book-grounded frame while its rescue and combat details stay labeled gameplay invention., canon_effect: framing_added_without_new_canon_claims}
  - {id: litter_as_rescue_traveler, canon_status: gameplay_invention, decision: Represent litter-borne Tam as Rand's paired rescue traveler with the litter's weight imposing LT's rescue movement penalty., source_beats: [c3_litter_built, c4_night_road], rationale: Rescue-carry keeps Tam visibly at stake while Rand alone hauls the litter and preserves the journey's physical burden., canon_effect: tactical_representation_added}
  - {id: long_road_hide, canon_status: gameplay_invention, decision: Stage the passing column and returning rider as scripted spawns with a watched road region where entry or engagement loses., source_beats: [c4_hide_mechanics, c4_column_passes, c4_rider_returns], rationale: Make detection the failure state without inventing a fight the book refuses., canon_effect: objective_and_tactical_detail_invented}
  - {id: walk_leg_split, canon_status: gameplay_invention, decision: Split the Chapter 7 walk into a litter leg ending at the inn door and a running leg ending at the bonfires., source_beats: [c5_walk_leg_split, c5_to_the_inn, c5_bonfires], rationale: Two short destination legs keep the denouement playable without padding., canon_effect: prose_walk_split_into_playable_legs}
  - {id: c5_green_talk_staging, canon_status: gameplay_invention, decision: "Stage Luhhan and Egwene as adjacent Talks during the litter leg and Nynaeve's examination as the required Wisdom-row interrupt. Egwene's Talk compresses her bandage run and later hug into one encounter whose playable timing may shift.", source_beats: [c5_luhhan_meets, c5_nynaeve_refusal, c5_to_the_inn], rationale: Keep all three book encounters visible on the reused Green without blocking the player on optional conversations or claiming a new event., canon_effect: canonical_moments_compressed_as_map_interactions}
  - {id: ending_question_card, canon_status: gameplay_invention, decision: "After Moiraine agrees to come, hold the ending card on Rand's unanswered question from the Long Road: Light, who am I?", source_beats: [c4_dragonmount_speech, c5_moiraine_heals], rationale: Carry the parentage rupture through the concrete hope of help without adding story beyond the Chapter 7 boundary., canon_effect: direct_line_repeated_as_ending_frame}
  - {id: boundary_extension, canon_status: direct, decision: End the campaign when Moiraine agrees to heal Tam at the close of Chapter 7., source_beats: [c5_moiraine_heals], rationale: The owner removed the pre-fever-speech boundary; the healing promise is the book's own resting point., canon_effect: boundary_moved_to_chapter_7_close}
  - {id: farmboy_class_lines, canon_status: gameplay_invention, decision: "Give the three Two Rivers lads distinct FE8-grounded class lines under original names: Rand is a Swordsman promoting to Blademark (FE8 Myrmidon to Swordmaster), Mat is a Trickster promoting to Nightblade or Highwayman (FE8 Thief to Assassin or Rogue), and Perrin is an Apprentice promoting to Hammerhand (FE8 Fighter to Warrior). Rand and Mat keep Bow and Utility beside their sword lock so the Chapter 0 stone throws and the hunting bow still work.", source_beats: [c0_meet_village_circle, c2_named_villagers_join], rationale: "Fire Emblem class identity is what makes each friend play differently; the FE8 Myrmidon, Thief, and Fighter lines match the swordsman, chancer, and smith's apprentice the book already gives us, while the class names stay original and the tutorial bow stays usable.", canon_effect: class_identity_and_progression_invented}
  - {id: moiraine_ball_lightning_weave, canon_status: gameplay_invention, decision: "Give Moiraine a scarce Ball Lightning weave with a five-use budget, range 2 to 3, and its own blue-white strike animation, alongside the retained short-range Weave of Air.", source_beats: [c2_bran_account, c2_village_defense], rationale: "Bran's Chapter 7 account (07:135-141) is the only channeling the book attributes to Moiraine on Winternight: ball lightning called from a clear sky and sent darting at the Trollocs, shattering them as it shatters trees. The reach, might, hit, use count, and the melee-capable Weave of Air beside it are invented so the reported feat becomes a readable tactical choice instead of a second generic attack; Lan's angreal remark (07:199) motivates the small use budget.", canon_effect: reported_canon_feat_translated_into_tactical_kit}
  - {id: moiraine_heals_by_weave_not_herbs, canon_status: inferred, decision: "Remove Healing Herbs from Moiraine and give her Weave of Spirit, a channeled 14-HP battle-wound mend at range 1 to 2 reached through the same top-level spell action; Nynaeve and Egwene keep the village herb pouch.", source_beats: [c2_village_defense, c2_nynaeve_battle_aid, c5_bran_and_thom], rationale: "Bran states that Aes Sedai cure where medicines fail (07:151) while the Wisdom's craft has already run out (07:185), so a channeler carrying village remedies contradicts the passage the chapter is built on. The weave stays a battle-wound mend, weaker than the off-slice intervention Tam needs, and no scene claims otherwise.", canon_effect: village_remedies_removed_from_channeler}
  - {id: power_wrought_blades_never_break, canon_status: inferred, decision: "Display Tam's sword as Heron-marked Sword and Lan's as Power-wrought Sword, and give both LT's no-uses durability so neither can break or be repaired.", source_beats: [c1_tam_reveals_sword, c2_bran_account], rationale: "Chapter 5 (05:59-63) puts a bronze heron on the scabbard, another on the long hilt, and a third etched into the steel, and says that except for the herons Tam's sword looked a good deal like Lan's: one make, two blades. The book never hyphenates heron-mark and never calls either blade Power-wrought, so Lan's name is drawn from the wider series rather than these chapters; no proper noun is invented for a weapon the text leaves unnamed. Indestructibility is the mechanical reading of that make.", canon_effect: blade_names_and_durability_grounded_in_make_not_proper_nouns}
  - {id: village_herbs_are_carried_items, canon_status: gameplay_invention, decision: "Compile Healing Herbs as an ordinary carried item used from the Item command, drop the now-unused Staff weapon type, and relabel LT's spell action Weave, which only Moiraine's channeled mend now reaches.", source_beats: [c2_nynaeve_battle_aid, c2_defense_objective], rationale: "Nobody in the slice carries a staff; the Staff label was an artifact of LT's weapon types that made the Wisdom's pouch and an Aes Sedai weave share one command. Herbs are physical, so they belong to Items, and the weave action can now be named for what it is.", canon_effect: command_fiction_corrected_no_story_change}
  - {id: background_rider_optional_encounter, canon_status: inferred, decision: "Stand one Black Rider inert at [1,1] in the far top-left of the Emond's Field battle, armed only so it can answer a blow; a player-initiated strike wakes it once and hands it pursue AI, and it is never part of the rescue quota or any win or loss condition.", source_beats: [c2_emonds_field_attacked, c2_village_defense], rationale: "Narg says the Myrddraal wants to talk and expects the others back (05:195), and the Westwood column is led by a horseman whose cloak hangs undisturbed by the wind (06:65), so a rider overlooking the attacked village is a supported inference. It never fights on-page in these chapters, so the encounter stays optional: LT's all-None AI emits no behaviour at all, and counterattack legality is decided by the combat solver rather than AI, so it only ever answers a strike.", canon_effect: inferred_presence_staged_as_optional_danger}
