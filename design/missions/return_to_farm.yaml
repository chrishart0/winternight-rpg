schema_version: "0.2"
id: wn03_return_to_farm
title: The Ruined Farm
chapter_index: 3
canon_status: direct
source_beats: [c3_rand_returns_alone, c3_dead_flock, c3_home_changed, c3_supply_search, c3_recover_sword, c3_lone_trolloc, c3_wounded_trolloc_setup, c3_rand_rejoins_tam, c3_litter_built]
intro_scene: sc_c3_return_intro
outro_scene: sc_c3_rejoin_tam
objective: {type: search_escape, display_text: "Find supplies,By turn 12", unit: rand, region: westwood_exit}
failure_conditions:
  - {type: unit_death, unit: rand}
map: {template: althor_farm, variant: ruined_return, seed: 5003}
units:
  - {id: rand, character: rand, team: player, position: [1, 7]}
  - {id: lone_trolloc, character: wounded_trolloc, team: enemy, position: [13, 7], group: lone_trolloc_group, starts_on_map: false, ai: pursue, level: 2, stat_bonus: {HP: 1}}
regions:
  - {id: sheep_pen, position: [4, 6], size: [1, 3], region_type: event, sub_id: Visit, only_once: true, interrupt_move: true}
  - {id: farmhouse_approach, position: [6, 7], region_type: event, sub_id: Visit, only_once: true, interrupt_move: true, highlight: lightyellow}
  - {id: water, position: [7, 10], region_type: event, sub_id: Search, only_once: true, highlight: lightblue}
  - {id: bandages, position: [10, 5], region_type: event, sub_id: Search, only_once: true, highlight: lightblue}
  - {id: blankets, position: [12, 7], region_type: event, sub_id: Search, only_once: true, highlight: lightblue}
  - {id: tams_sword, position: [10, 8], region_type: event, sub_id: Search, required_flags: [water_found, bandages_found, blankets_found], only_once: true, highlight: lightyellow}
  - {id: westwood_exit, position: [0, 5], size: [1, 4], region_type: event, sub_id: Escape, required_flags: [narg_encountered], only_once: true, interrupt_move: true, highlight: lightgreen}
  - {id: westwood_quick_exit, position: [4, 5], size: [1, 4], region_type: event, sub_id: Escape, required_flags: [trolloc_defeated], only_once: true, interrupt_move: true, highlight: lightgreen, starts_active: false}
reinforcements:
  - {id: lone_trolloc_group, unit_ids: [lone_trolloc]}
events:
  - id: return_start
    trigger: {type: level_start}
    actions:
      - {type: set_fog, value: 3}
      - {type: set_flag, target: dead_flock_seen, value: false}
      - {type: set_flag, target: farmhouse_reached, value: false}
      - {type: set_flag, target: water_found, value: false}
      - {type: set_flag, target: bandages_found, value: false}
      - {type: set_flag, target: blankets_found, value: false}
      - {type: set_flag, target: sword_found, value: false}
      - {type: set_flag, target: narg_encountered, value: false}
      - {type: set_flag, target: trolloc_defeated, value: false}
      - {type: set_flag, target: tam_fever_warning, value: false}
      - {type: set_flag, target: tam_fever_caught, value: false}
      - {type: play_scene, target: sc_c3_return_intro}
  - id: dead_flock
    trigger: {type: region_interact, unit: rand, region: sheep_pen}
    condition: {flag_false: dead_flock_seen}
    actions:
      - {type: set_flag, target: dead_flock_seen, value: true}
      - {type: play_scene, target: sc_c3_dead_flock}
      - {type: set_fog, value: 4}
      - {type: highlight_target, target: farmhouse_approach}
      - {type: mark_visited, target: rand}
  - id: reach_farmhouse
    trigger: {type: region_interact, unit: rand, region: farmhouse_approach}
    condition: {flag_false: farmhouse_reached}
    actions:
      - {type: set_flag, target: farmhouse_reached, value: true}
      - {type: play_scene, target: sc_c3_farmhouse_approach}
      - {type: mark_visited, target: rand}
  - id: find_water
    trigger: {type: region_interact, unit: rand, region: water}
    condition: {flag_false: water_found}
    actions:
      - {type: set_flag, target: water_found, value: true}
      - {type: play_scene, target: sc_c3_water}
      - {type: give_item, target: rand, value: water_flask}
      - {type: mark_visited, target: rand}
  - id: find_bandages
    trigger: {type: region_interact, unit: rand, region: bandages}
    condition: {flag_false: bandages_found}
    actions:
      - {type: set_flag, target: bandages_found, value: true}
      - {type: play_scene, target: sc_c3_bandages}
      - {type: give_item, target: rand, value: bandages}
      - {type: mark_visited, target: rand}
  - id: find_blankets
    trigger: {type: region_interact, unit: rand, region: blankets}
    condition: {flag_false: blankets_found}
    actions:
      - {type: set_flag, target: blankets_found, value: true}
      - {type: play_scene, target: sc_c3_blankets}
      - {type: give_item, target: rand, value: blankets}
      - {type: mark_visited, target: rand}
  - id: recover_sword
    trigger: {type: region_interact, unit: rand, region: tams_sword}
    condition: {all_flags: [water_found, bandages_found, blankets_found], flag_false: sword_found}
    actions:
      - {type: set_flag, target: sword_found, value: true}
      - {type: play_scene, target: sc_c3_sword_recovery}
      - {type: give_item, target: rand, value: tams_sword}
      - {type: equip_item, target: rand, value: tams_sword}
      - {type: spawn_group, target: lone_trolloc_group}
      - {type: play_scene, target: sc_c3_trolloc_appears}
      - {type: change_objective, target: both, value: "Return to Tam,By turn 12"}
      - {type: mark_visited, target: rand}
  - id: rand_trolloc_combat_quote
    trigger: {type: combat_start, unit: rand, unit2: lone_trolloc}
    condition: {flag_false: narg_encountered}
    actions:
      - {type: play_scene, target: sc_c3_rand_combat_quote}
      - {type: set_flag, target: narg_encountered, value: true}
      - {type: change_objective, target: both, value: "Return to Tam,By turn 12"}
  - id: narg_rand_combat_quote
    trigger: {type: combat_start, unit: lone_trolloc, unit2: rand}
    condition: {flag_false: narg_encountered}
    actions:
      - {type: play_scene, target: sc_c3_rand_combat_quote}
      - {type: set_flag, target: narg_encountered, value: true}
      - {type: change_objective, target: both, value: "Return to Tam,By turn 12"}
  - id: trolloc_defeated
    trigger: {type: unit_death, unit: lone_trolloc}
    actions:
      - {type: set_flag, target: trolloc_defeated, value: true}
      - {type: activate_region, target: westwood_quick_exit}
      - {type: change_objective, target: both, value: "Return to Tam,By turn 12"}
      - {type: highlight_target, target: westwood_quick_exit}
  - id: tam_fever_warning
    trigger: {type: turn_start, turn: 10}
    actions:
      - {type: set_flag, target: tam_fever_warning, value: true}
      - {type: play_scene, target: sc_c3_fever_warning}
  - id: fever_deadline_loss
    trigger: {type: turn_start, turn: 13}
    actions:
      - {type: set_flag, target: tam_fever_caught, value: true}
      - {type: play_scene, target: sc_c3_fever_caught}
      - {type: lose}
  - id: return_escape
    trigger: {type: region_interact, unit: rand, region: westwood_exit}
    condition: {all_flags: [water_found, bandages_found, blankets_found, sword_found, narg_encountered]}
    actions: [{type: win}]
  - id: quick_return_escape
    trigger: {type: region_interact, unit: rand, region: westwood_quick_exit}
    condition: {all_flags: [water_found, bandages_found, blankets_found, sword_found, narg_encountered, trolloc_defeated]}
    actions: [{type: win}]
  - id: return_outro
    trigger: {type: level_end}
    actions:
      - {type: play_scene, target: sc_c3_cart_shafts}
      - {type: play_scene, target: sc_c3_rejoin_tam}
narrative_constraints:
  tam_alive: true
  required_supplies: 3
  trolloc_may_be_evaded: true
  trolloc_encounter_required: true
  trolloc_may_be_defeated: true
  dead_flock_interrupt: true
  return_deadline_turn: 12
  quick_exit_on_narg_defeat: true
  sheep_pen_reveals_farmhouse: true
  narg_broken_speech_quoted: true
  lunge_resolved_by_sword_up: true
  litter_from_cart_shafts: true
  chapter_6_material: true
target_play: {minimum_turns: 6, maximum_turns: 12, expected_minutes: [10, 18]}
