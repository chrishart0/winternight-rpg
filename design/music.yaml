schema_version: "2.0"
generator_version: winternight-music-2

provenance:
  authorship: original_and_arranged
  adaptation_label: gameplay_invented_with_external_arrangement
  samples: none
  external_melodies: "Blind Guardian, 'Wheel of Time,' from At the Edge of Time (Nuclear Blast, 2010): the wn_wheel_of_time title suite re-voices the chromatic main riff, build, and chorus/hook contour audited against reviewed Songsterr tab s410588 revision 927374; all other tracks original."
  copyright_constraints:
    - Do not quote, imitate, or arrange music from Fire Emblem or LT-Maker defaults.
    - Do not use recorded samples, sample libraries, MIDI files, or model-generated audio.
    - Treat wn_wheel_of_time as a third-party derivative arrangement requiring separate rights review and licensing before any public distribution.
  method: Harmony blocks, phrases, accompaniment patterns, drum kits, orchestration roles, and fixed noise seeds authored for this private vertical slice; the title track re-synthesizes the declared external theme; all audio is rendered by deterministic band-limited additive synthesis.

render:
  sample_rate: 22050
  channels: 1
  sample_width_bits: 16
  codec: vorbis
  encoder_quality: 3
  loop_boundary_fade_ms: 20
  master_rms_dbfs: -18.5
  master_knee: 0.5

assignments:
  title: wn_wheel_of_time
  special:
    game_over: wn_broken_wheel
    promotion: wn_hearthlight
    class_change: wn_hearthlight
  levels:
    # Chapter 0 uses Hearthlight throughout its scripted raven attack tutorial,
    # so phase and battle transitions never arm a pointless fade. Combat chapters
    # 1-4 alternate player and enemy themes through LT's native level music keys.
    wn00_tutorial:
      player_phase: wn_hearthlight
      enemy_phase: wn_hearthlight
      player_battle: wn_hearthlight
      enemy_battle: wn_hearthlight
    wn01_farm_escape:
      player_phase: wn_black_wind
      enemy_phase: wn_shadow_advance
      player_battle: wn_black_wind
      enemy_battle: wn_shadow_advance
    wn02_village_defense:
      player_phase: wn_black_wind
      enemy_phase: wn_shadow_advance
      player_battle: wn_black_wind
      enemy_battle: wn_shadow_advance
    wn03_return_to_farm:
      player_phase: wn_embers_on_snow
