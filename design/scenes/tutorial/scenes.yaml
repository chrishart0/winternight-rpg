  - character: rand
    portrait: rand_neutral
    position: left
  - character: tam
    portrait: tam_neutral
    position: right
  beats:
  - type: action
    action: narration
    text: Inside the Winespring Inn, the Council gathers.
  - type: dialogue
    speaker: tam
    intent: contain_war
    text: All in Ghealdan, thank the Light.
  - type: dialogue
    speaker: tam
    intent: contain_war
    text: It hasn't spread, or had not the last Master Fain knew.
  - type: dialogue
    speaker: tam
    intent: order_watch
    text: Day after tomorrow we will send men to Deven Ride
  - type: dialogue
    speaker: tam
    intent: order_watch
    text: and Watch Hill, and Taren Ferry, too.
  - type: dialogue
    speaker: rand
    intent: question_risk
    text: But I thought you said we didn't have to worry.
  - type: dialogue
    speaker: tam
    intent: distinguish_should
    text: I said should not, boy, not did not.
  - type: dialogue
    speaker: tam
    intent: remember_cost
    text: I've seen men die because they were sure
  - type: dialogue
    speaker: tam
    intent: remember_cost
    text: that what should not happen, would not.
  - type: dialogue
    speaker: tam
    intent: decide_home
    text: Rand, it's time for us to be getting back to the farm.
  - type: dialogue
    speaker: rand
    intent: resist_departure
    text: I thought we were staying for Winternight.
  - type: dialogue
    speaker: tam
    intent: firm_departure
    text: We are going now. Five minutes,
  - type: dialogue
    speaker: tam
    intent: firm_departure
