scenes:
- id: sc_c0_quarry_road
  schema_version: '0.2'
  chapter: wn00_tutorial
  canon_status: direct
  source_beats:
  - c0_road_to_emonds_field
  - c0_black_rider_appears
  - c0_arrive_emonds_field
  trigger:
    type: call
  background: quarry_road_cold
  cast:
  - character: rand
    portrait: rand_neutral
    position: right
  - character: tam
    portrait: tam_neutral
    position: left
  beats:
  - type: action
    action: narration
    text: Rand and Tam cart cider down the cold Quarry Road.
  - type: dialogue
    speaker: tam
    intent: check_on_rand
    text: Are you all right, lad?
  - type: dialogue
    speaker: rand
    intent: report_rider
    text: A rider. A stranger, following us.
  - type: dialogue
    speaker: tam
    intent: nonconfirmation
    text: I wouldn't doubt your word, lad, but where has he gone?
  - type: action
    action: narration
    text: Wind lashes them. The rider's black cloak never stirred.
  - type: dialogue
    speaker: rand
    intent: insist
    text: He was there.
  - type: dialogue
    speaker: tam
    intent: steady_fear
    text: Remember the flame, lad, and the void.
  - type: action
    action: narration
    text: Find Mat on the Green beside the cider cart.
- id: sc_c0_mat_and_news
  schema_version: '0.2'
  chapter: wn00_tutorial
  canon_status: direct
  source_beats:
  - c0_meet_village_circle
  - c0_cider_cellar
  trigger:
    type: call
  background: emonds_field_day
  cast:
  - character: rand
    portrait: rand_neutral
    position: left
  - character: mat
    portrait: mat_neutral
    position: center
  - character: tam
    portrait: tam_neutral
    position: right
  beats:
  - type: dialogue
    speaker: mat
    intent: badger_plan
    text: Dav and I caught a big old badger,
  - type: dialogue
    speaker: mat
    intent: badger_plan
    text: all grouchy at being pulled out of his den.
  - type: dialogue
    speaker: rand
    intent: duty_first
    text: I promised to unload the cider.
  - type: dialogue
    speaker: rand
    intent: duty_first
    text: I can meet you later, though.
  - type: dialogue
    speaker: mat
    intent: complain
    text: Toting barrels! Burn me,
  - type: dialogue
    speaker: mat
    intent: complain
    text: I'd rather play stones with my baby sister.
  - type: dialogue
    speaker: rand
    intent: shared_rider
    text: A man in a black cloak, on a black horse?
  - type: dialogue
    speaker: rand
    intent: shared_rider
    text: And his cloak doesn't move in the wind?
  - type: dialogue
    speaker: mat
    intent: admit_fear
    text: You saw him, too? I thought I was the only one.
  - type: dialogue
    speaker: mat
    intent: admit_fear
    text: Don't laugh, Rand, but he scared me.
  - type: dialogue
    speaker: rand
    intent: answer_fear
    text: I'm not laughing. He scared me, too.
  - type: dialogue
    speaker: tam
    intent: assign_help
    text: I see you've come to help Rand
  - type: dialogue
    speaker: tam
    intent: assign_help
    text: unload the cider. Good lad.
  - type: dialogue
    speaker: mat
    intent: accept_errand
    text: Oh, why not? Like your da said,
  - type: dialogue
    speaker: mat
    intent: accept_errand
    text: the quicker it's in the cellar.
  - type: action
    action: narration
    text: The cider cask waits on the cart.
- id: sc_c0_inn_before_mat
  schema_version: '0.2'
