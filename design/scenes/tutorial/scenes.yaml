- id: sc_c0_cider_first
  schema_version: "0.2"
  chapter: wn00_tutorial
  canon_status: direct
  source_beats: [c0_cider_cellar]
  trigger: {type: call}
  background: winespring_inn
  cast:
    - {character: rand, portrait: rand_neutral, position: left}
    - {character: mat, portrait: mat_neutral, position: right}
  beats:
    - {type: action, action: narration, text: "The cider cask settles into a cellar rack."}
    - {type: action, action: narration, text: "Above them, the Village Council goes quiet."}
    - {type: dialogue, speaker: rand, intent: ask_about_luhhan, text: "Now, what did you do"}
    - {type: dialogue, speaker: rand, intent: ask_about_luhhan, text: "that you have to avoid Master Luhhan?"}
    - {type: dialogue, speaker: mat, intent: explain_prank, text: "Nothing, really. I covered two of his dogs with flour,"}
    - {type: dialogue, speaker: mat, intent: explain_prank, text: "so they were all white."}
    - {type: dialogue, speaker: mat, intent: deny_blame, text: "How was I to know they'd run straight home?"}
    - {type: dialogue, speaker: mat, intent: deny_blame, text: "It really isn't my fault."}
    - {type: dialogue, speaker: rand, intent: name_real_danger, text: "If I were you, I'd worry more about"}
    - {type: dialogue, speaker: rand, intent: name_real_danger, text: "Alsbet Luhhan than about the blacksmith."}
    - {type: action, action: narration, text: "Outside, a raven watches."}
- id: sc_c0_raven_attack
  schema_version: "0.2"
  chapter: wn00_tutorial
  canon_status: direct
  source_beats: [c0_raven_omen]
  trigger: {type: call}
  background: emonds_field_day
  cast:
    - {character: rand, portrait: rand_neutral, position: left}
