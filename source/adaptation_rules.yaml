schema_version: "0.2"
dialogue_policy: original_paraphrase_only
decisions:
  - {id: road_as_scene, canon_status: gameplay_invention, decision: Present the road and rider through portraits and a background., source_beats: [c0_road_to_emonds_field, c0_black_rider_appears], rationale: Avoid a third tactical layout., canon_effect: presentation_only}
  - {id: tutorial_errands, canon_status: gameplay_invention, decision: Use deliveries talks inventory and archery targets as tutorial tasks., source_beats: [c0_tutorial_errands], rationale: Teach mechanics without a contrived attack., canon_effect: low_stakes_interactions_added}
  - {id: scripted_tam_wound, canon_status: gameplay_invention, decision: Trigger Tam's wound after escape or the turn threshold., source_beats: [c1_rand_flees, c1_tam_wounded], rationale: Preserve the story outcome independently of tactical performance., canon_effect: outcome_determinized}
  - {id: village_parallel_battle, canon_status: inferred, decision: Show an inferred village defense led by Lan and Moiraine., source_beats: [c2_emonds_field_attacked, c2_village_defense], rationale: Test defense rescue magic and changed map state., canon_effect: unseen_parallel_sequence_constructed}
  - {id: two_layout_reuse, canon_status: gameplay_invention, decision: Reuse each location as two narrative-state variants., source_beats: [c0_arrive_emonds_field, c1_trollocs_breach_farm, c2_emonds_field_attacked, c3_rand_returns_alone], rationale: Demonstrate state changes while controlling scope., canon_effect: presentation_only}
  - {id: supply_regions, canon_status: gameplay_invention, decision: Translate the supply search into three interactions., source_beats: [c3_supply_search], rationale: Give the prose action a readable tactical objective., canon_effect: search_granularity_invented}
  - {id: wounded_trolloc_fairness, canon_status: gameplay_invention, decision: Begin the isolated Trolloc already wounded., source_beats: [c3_lone_trolloc], rationale: Preserve danger without making Rand an expert., canon_effect: tactical_circumstances_adjusted}
  - {id: campaign_endpoint, canon_status: direct, decision: End immediately after Rand rejoins wounded Tam with supplies., source_beats: [c3_rand_rejoins_tam], rationale: Enforce the Chapter 5 boundary., canon_effect: truncation_before_chapter_6}
