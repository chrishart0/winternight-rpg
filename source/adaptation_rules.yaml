schema_version: "0.2"
dialogue_policy: original_paraphrase_only
decisions:
  - {id: road_as_scene, canon_status: gameplay_invention, decision: Present the road and rider through portraits and a background., source_beats: [c0_road_to_emonds_field, c0_black_rider_appears], rationale: Avoid a third tactical layout., canon_effect: presentation_only}
  - {id: tutorial_errands, canon_status: gameplay_invention, decision: Use deliveries talks inventory and archery targets as tutorial tasks that also walk the living village., source_beats: [c0_tutorial_errands], rationale: Teach mechanics without a contrived attack., canon_effect: low_stakes_interactions_added}
  - {id: scripted_tam_wound, canon_status: gameplay_invention, decision: Trigger Tam's wound after escape or the turn threshold., source_beats: [c1_rand_flees, c1_tam_wounded], rationale: Preserve the story outcome independently of tactical performance., canon_effect: outcome_determinized}
  - {id: village_parallel_battle, canon_status: inferred, decision: "Show an inferred village defense led by Lan and Moiraine. Keep inferred status explicit in metadata and the adaptation ledger, not in opening narration.", source_beats: [c2_emonds_field_attacked, c2_village_defense], rationale: Test defense rescue magic and changed map state without claiming direct depiction., canon_effect: unseen_parallel_sequence_constructed}
  - {id: village_defense_rules, canon_status: gameplay_invention, decision: Require six turns and three rescues while one optional home can be protected., source_beats: [c2_defense_objective, c2_homes_threatened], rationale: Create readable tactical pressure while showing unavoidable wider damage., canon_effect: objective_and_tactical_detail_invented}
  - {id: named_circle_absent, canon_status: inferred, decision: Keep Mat Perrin and Egwene off the defense map and let Lan and Moiraine note their absence without inventing their deaths., source_beats: [c2_unseen_circle], rationale: Pay off Chapter 0 attachment without claiming unseen fates as fact., canon_effect: unnamed_civilians_stand_in}
  - {id: two_layout_reuse, canon_status: gameplay_invention, decision: Reuse each location as two narrative-state variants., source_beats: [c0_arrive_emonds_field, c1_trollocs_breach_farm, c2_emonds_field_attacked, c3_rand_returns_alone], rationale: Demonstrate state changes while controlling scope., canon_effect: presentation_only}
  - {id: supply_regions, canon_status: gameplay_invention, decision: Translate the supply search into three care-bearing interactions plus a ruined-house approach., source_beats: [c3_home_changed, c3_supply_search], rationale: Give the prose action a readable tactical objective without turning home into a storehouse caption., canon_effect: search_granularity_invented}
  - {id: wounded_trolloc_fairness, canon_status: gameplay_invention, decision: Begin the isolated Trolloc already wounded., source_beats: [c3_wounded_trolloc_setup], rationale: Preserve danger without making Rand an expert., canon_effect: tactical_circumstances_adjusted}
  - {id: campaign_endpoint, canon_status: direct, decision: End immediately after Rand rejoins wounded Tam with supplies., source_beats: [c3_rand_rejoins_tam], rationale: Enforce the Chapter 5 boundary., canon_effect: truncation_before_chapter_6}
  - {id: book_grounded_paraphrase, canon_status: direct, decision: "Rewrite playable talk from private EotW chapter 1-5 locators as original paraphrase, keeping the unmoving cloak, shared rider fear, Ghealdan news, Tam's hidden sword, and Narg.", source_beats: [c0_black_rider_appears, c0_meet_village_circle, c0_fain_troubling_news, c1_tam_reveals_sword, c3_lone_trolloc], rationale: Raise fidelity to the novel without committing protected prose., canon_effect: dialogue_realigned_to_source_beats}
